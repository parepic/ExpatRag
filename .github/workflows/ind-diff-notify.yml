name: IND diff notification

on:
  schedule:
    - cron: '0 7 * * 1'  # every Monday at 07:00 UTC
  workflow_dispatch:       # allow manual trigger from the Actions tab

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build pipeline image
        run: docker compose build ind-diff-notify

      - name: Run IND diff notification pipeline
        run: docker compose run --rm ind-diff-notify
        env:
          SUPABASE_API_URL: ${{ secrets.SUPABASE_API_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          SCRAPE_DO_TOKEN: ${{ secrets.SCRAPE_DO_TOKEN }}
